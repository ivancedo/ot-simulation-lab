networks:
  sim05:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.5.0/24

x-py: &py
  image: python:3.12-slim
  working_dir: /app
  volumes:
    - .:/app
  restart: unless-stopped

services:
  wits_server:
    <<: *py
    container_name: s05_wits_server
    hostname: wits-server
    command: python wits_server.py
    networks: { sim05: { ipv4_address: 172.30.5.10 } }

  wits_client:
    <<: *py
    container_name: s05_wits_client
    hostname: wits-client
    command: python wits_client.py
    depends_on: [wits_server]
    networks: { sim05: { ipv4_address: 172.30.5.11 } }

  hart_device:
    <<: *py
    container_name: s05_hart_device
    hostname: hart-device
    command: python hart_device.py
    networks: { sim05: { ipv4_address: 172.30.5.12 } }

  hart_host:
    <<: *py
    container_name: s05_hart_host
    hostname: hart-host
    command: python hart_host.py
    depends_on: [hart_device]
    networks: { sim05: { ipv4_address: 172.30.5.13 } }
