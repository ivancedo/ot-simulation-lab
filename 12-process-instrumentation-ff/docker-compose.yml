networks:
  sim12:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.12.0/24

x-py: &py
  image: python:3.12-slim
  working_dir: /app
  volumes:
    - .:/app
  restart: unless-stopped

services:
  ff_transmitter:
    <<: *py
    container_name: s12_ff_transmitter
    hostname: ff-transmitter
    command: python ff_transmitter.py
    networks: { sim12: { ipv4_address: 172.30.12.10 } }

  ff_valve:
    <<: *py
    container_name: s12_ff_valve
    hostname: ff-valve
    command: python ff_valve.py
    networks: { sim12: { ipv4_address: 172.30.12.11 } }

  ff_linking_device:
    <<: *py
    container_name: s12_ff_linking_device
    hostname: ff-linking-device
    command: python ff_linking_device.py
    depends_on: [ff_transmitter, ff_valve]
    networks: { sim12: { ipv4_address: 172.30.12.12 } }
