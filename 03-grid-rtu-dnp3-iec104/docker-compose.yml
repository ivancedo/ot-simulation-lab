networks:
  sim03:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.3.0/24

x-py: &py
  image: python:3.12-slim
  working_dir: /app
  volumes:
    - .:/app
  restart: unless-stopped

services:
  dnp3_outstation:
    <<: *py
    container_name: s03_dnp3_rtu
    hostname: dnp3-rtu
    command: python dnp3_outstation.py
    networks: { sim03: { ipv4_address: 172.30.3.10 } }

  dnp3_master:
    <<: *py
    container_name: s03_dnp3_master
    hostname: dnp3-master
    command: python dnp3_master.py
    depends_on: [dnp3_outstation]
    networks: { sim03: { ipv4_address: 172.30.3.11 } }

  iec104_station:
    <<: *py
    container_name: s03_iec104_station
    hostname: iec104-station
    command: python iec104_station.py
    networks: { sim03: { ipv4_address: 172.30.3.12 } }

  iec104_master:
    <<: *py
    container_name: s03_iec104_master
    hostname: iec104-master
    command: python iec104_master.py
    depends_on: [iec104_station]
    networks: { sim03: { ipv4_address: 172.30.3.13 } }
