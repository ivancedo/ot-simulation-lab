networks:
  sim11:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.11.0/24

x-py: &py
  image: python:3.12-slim
  working_dir: /app
  volumes:
    - .:/app
  restart: unless-stopped

services:
  iccp_server:
    <<: *py
    container_name: s11_iccp_server
    hostname: control-center-a
    command: python iccp_server.py
    networks: { sim11: { ipv4_address: 172.30.11.10 } }

  iccp_client:
    <<: *py
    container_name: s11_iccp_client
    hostname: control-center-b
    command: python iccp_client.py
    depends_on: [iccp_server]
    networks: { sim11: { ipv4_address: 172.30.11.11 } }
