networks:
  sim09:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.9.0/24

x-py: &py
  image: python:3.12-slim
  working_dir: /app
  volumes:
    - .:/app
  restart: unless-stopped

services:
  opcua_binary:
    <<: *py
    container_name: s09_opcua_binary
    hostname: opcua-binary
    command: python opcua_binary_server.py
    networks: { sim09: { ipv4_address: 172.30.9.10 } }

  opcua_xml:
    <<: *py
    container_name: s09_opcua_xml
    hostname: opcua-xml
    command: python opcua_xml_server.py
    networks: { sim09: { ipv4_address: 172.30.9.11 } }

  opc_da:
    <<: *py
    container_name: s09_opc_da
    hostname: opc-da
    command: python opc_da_server.py
    networks: { sim09: { ipv4_address: 172.30.9.12 } }

  opc_aggregator:
    <<: *py
    container_name: s09_opc_aggregator
    hostname: opc-aggregator
    command: python opc_aggregator.py
    depends_on: [opcua_binary, opcua_xml, opc_da]
    networks: { sim09: { ipv4_address: 172.30.9.20 } }
